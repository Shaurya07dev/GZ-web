# ponytail: this dev machine has ~16GB RAM total, ~4GB free with the
# emulator running — 8G/4G defaults OOM-killed the daemon. Raise if you're
# building on a bigger machine or the emulator isn't running alongside.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# flutter_nfc_kit 3.7 supports AGP 9's built-in Kotlin path. Keeping this on
# avoids the legacy plugin warning and is required by current Flutter Android
# templates.
android.builtInKotlin=true
# AGP 9 optimized release resource shrinking (used below) requires non-final
# resource IDs; Flutter and the maintained plugins support them.
android.nonFinalResIds=true
