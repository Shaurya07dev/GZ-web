<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artwork Order Fulfilment: Step-by-Step Explainer</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f1b16;--mute:#6b645a;--line:#e6e0d6;--acc:#b4532a;--accsoft:#f7e6dc;--canvas:#f1ead9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#211d17;--ink:#f1ece3;--mute:#a79f92;--line:#383229;--acc:#e5865c;--accsoft:#3a261b;--canvas:#2d271c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--card:#211d17;--ink:#f1ece3;--mute:#a79f92;--line:#383229;--acc:#e5865c;--accsoft:#3a261b;--canvas:#2d271c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Noto Serif Devanagari","Mangal","Times New Roman",serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:.2em 0 .1em;line-height:1.2}
.sub{color:var(--mute);margin:0 0 16px;font-family:system-ui,sans-serif;font-size:.95rem}
.tabs{display:flex;gap:8px;margin-bottom:16px;font-family:system-ui,sans-serif}
.tabs button{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;font-size:.9rem}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.cnt{font:.8rem system-ui,sans-serif;color:var(--mute);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stage{background:var(--canvas);border-radius:10px;padding:10px;display:flex;justify-content:center;align-items:center;min-height:220px}
.stage svg{max-width:100%;height:auto}
.badge{display:inline-block;font:600 .75rem system-ui,sans-serif;background:var(--accsoft);color:var(--acc);padding:3px 10px;border-radius:999px;margin:14px 0 4px}
h2{margin:.2em 0 .3em;font-size:1.35rem}
ul.chk{padding-left:1.1em;margin:.4em 0 0}
.nar{margin-top:14px;padding:12px 14px;border-left:4px solid var(--acc);background:var(--accsoft);border-radius:0 8px 8px 0;font-style:italic}
.nar b{font:600 .7rem system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);display:block;font-style:normal;margin-bottom:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font-family:system-ui,sans-serif;align-items:center}
.ctl button,.print{padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;font-size:.95rem}
.ctl button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.ctl button:disabled{opacity:.4;cursor:default}
.ctl select{padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.dots button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font:.75rem system-ui,sans-serif;cursor:pointer}
.dots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dots button.done{border-color:var(--acc);color:var(--acc)}
#doc{display:none}
#doc .row{padding:12px 0;border-bottom:1px solid var(--line)}
#doc .row:last-child{border:0}
#doc h3{margin:0 0 4px;font-size:1.05rem}
#doc p{margin:.2em 0}
.print{margin-bottom:10px}
.note{font:.85rem system-ui,sans-serif;color:var(--mute);margin-top:10px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.lg{background:#fff;border-radius:10px;padding:4px;height:72px;width:auto;flex:none}
.sw{position:relative}
.wm{position:absolute;right:8px;bottom:8px;background:#fff;border-radius:8px;padding:2px;opacity:.92;line-height:0}
.wm img{height:40px;width:auto}
#vidhold{display:none}
.stage video{max-height:340px;max-width:100%;border-radius:8px;background:#000}
@media print{.tabs,.ctl,.dots,.bar,.cnt,#explainer,.print,.note{display:none!important}#doc{display:block!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><img class="lg" id="lgmain" alt="GZ logo"><div><h1 id="h1">Artwork Order Fulfilment</h1>
  <p class="sub" id="sub">From signing to delivery handover. A step-by-step explainer with narration.</p></div></div>
  <div class="tabs">
    <button id="t1" class="on">Explainer</button>
    <button id="t2">Narration doc</button>
    <button id="lh" class="on">हिन्दी</button>
    <button id="le">English</button>
  </div>

  <div id="explainer">
    <div class="bar"><i id="fill"></i></div>
    <div class="cnt" id="cnt"></div>
    <div class="card">
      <div class="sw"><div class="stage" id="stage"></div><span class="wm"><img id="lgwm" alt="GZ logo"></span></div>
      <span class="badge" id="badge"></span>
      <h2 id="title"></h2>
      <div id="body"></div>
      <div class="nar"><b id="nl">Narration</b><span id="narr"></span></div>
      <div class="ctl">
        <button id="prev">← Back</button>
        <button id="play" class="p">▶ Play narration</button>
        <button id="next">Next →</button>
        <select id="spd" aria-label="Speed"><option value="0.85">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option></select>
      </div>
      <div class="dots" id="dots"></div>
      <div class="note" id="vnote"></div>
    </div>
  </div>

  <div id="doc" class="card">
    <button class="print" id="pr" onclick="window.print()">Print or save as PDF</button>
    <div id="docbody"></div>
  </div>
</div>

<div id="vidhold"><video id="edgevid" controls muted playsinline loop preload="metadata" src="media/order-fulfilment-edge-protection.mp4"></video></div>

{b:"Welcome",t:"Order fulfilment overview",l:["Sign the artwork and label the back","Attach the NFC tag","Package by sales channel and hand over"],n:"Welcome. In this video, we’ll walk through the complete process to follow once you receive an order, from signing the artwork to handing it over to the delivery agent.",v:"intro"},
{b:"Step 1",t:"Sign the artwork",l:["Sign on the bottom right of the canvas or frame","Do this as soon as the order is received"],n:"Step one. As soon as you receive an order, make sure the artwork is signed on the bottom right side of the canvas or frame.",v:"sign"},
{b:"Step 2",t:"Write the details on the back",l:["Artist name","Title of artwork","Medium","Size","Place and year of creation","Sign here as well"],n:"Step two. Turn the artwork over. On the back, write and sign the following details: the artist’s name, the title of the artwork, the medium, the size, and the place and year of creation.",v:"back"},
{b:"Step 3",t:"Attach the NFC tag",l:["Back of the canvas, bottom left","Just behind the signature","Standard process for every artwork"],n:"Step three. Attach the NFC tag on the back of the canvas, at the bottom left, just behind the signature. This is a standard process for every artwork.",v:"nfc"},
{b:"Step 4",t:"Check the sales channel",l:["Marketplace: package as per the next steps, then hand over to the delivery agent","Aggregator: add the extra items in Step 5"],n:"Step four. Check the sales channel. If the sale is through the Marketplace, package the product using the steps that follow, and then hand the artwork over to the delivery agent.",v:"fork"},
{b:"Step 5",t:"Aggregator orders: add these items",l:["T-hanger attached to the painting","Sticky nails","Nylon thread","5 display cards, downloaded from the Display Card section","Print on 280 to 300 GSM paper in the sizes mentioned"],n:"Step five. If the order is from an aggregator sales channel, add the following items: a T-hanger attached to the painting, sticky nails, and nylon thread. Also include five display cards. Download these from the Display Card section and print them on 280 to 300 GSM paper, in the sizes mentioned.",v:"kit"},
{b:"Step 6",t:"Wrap with a paper roll",l:["Wrap the paper roll around the artwork"],n:"Step six. Wrap the artwork carefully in a paper roll.",v:"paper"},
{b:"Step 7",t:"Protect the edges",l:["Follow the packaging video exactly"],n:"Step seven. Protect the edges of the artwork, exactly as shown in the packaging video.",v:"edge"},
{b:"Step 8",t:"Bubble wrap",l:["Cover the entire artwork for cushioning"],n:"Step eight. Cover the entire artwork with bubble wrap for cushioning.",v:"bubble"},
{b:"Step 9",t:"Put it in a box",l:["Cardboard or wooden box","Use whichever is convenient"],n:"Step nine. Place the wrapped artwork in a cardboard or wooden box, whichever is more convenient.",v:"box"},
{b:"Step 10",t:"Attach the delivery sticker and invoice",l:["Stick both on the front of the box"],n:"Step ten. Attach the delivery sticker and invoice on the front of the box.",v:"label"},
{b:"Final step",t:"Hand over to the delivery agent",l:["Hand over the packaged box","Done. The artwork is on its way"],n:"Finally, hand the packaged box over to the delivery agent. That’s the complete process. Follow these steps every time to make sure each artwork reaches its buyer safe and ready to display. Thank you for watching.",v:"hand"}
];

{b:"स्वागत",t:"ऑर्डर पूर्ति का परिचय",l:["आर्टवर्क पर हस्ताक्षर करें और पीछे की ओर विवरण लिखें","NFC टैग लगाएँ","बिक्री चैनल के अनुसार पैक करें और सौंप दें"],n:"नमस्कार। इस वीडियो में हम देखेंगे कि ऑर्डर मिलने के बाद पूरी प्रक्रिया क्या है, यानी आर्टवर्क पर हस्ताक्षर करने से लेकर उसे डिलीवरी एजेंट को सौंपने तक।"},
{b:"चरण 1",t:"आर्टवर्क पर हस्ताक्षर करें",l:["कैनवास या फ्रेम के नीचे दाईं ओर हस्ताक्षर करें","ऑर्डर मिलते ही यह करें"],n:"चरण एक। ऑर्डर मिलते ही सुनिश्चित करें कि आर्टवर्क पर कैनवास या फ्रेम के नीचे दाईं ओर आपके हस्ताक्षर हों।"},
{b:"चरण 2",t:"पीछे की ओर विवरण लिखें",l:["कलाकार का नाम","आर्टवर्क का शीर्षक","माध्यम (Medium)","आकार (Size)","निर्माण का स्थान और वर्ष","यहाँ भी हस्ताक्षर करें"],n:"चरण दो। आर्टवर्क को पलटिए। पीछे की ओर ये विवरण लिखिए और हस्ताक्षर कीजिए: कलाकार का नाम, आर्टवर्क का शीर्षक, माध्यम, आकार, और निर्माण का स्थान तथा वर्ष।"},
{b:"चरण 3",t:"NFC टैग लगाएँ",l:["कैनवास के पीछे, नीचे बाईं ओर","हस्ताक्षर के ठीक पीछे","हर आर्टवर्क के लिए मानक प्रक्रिया"],n:"चरण तीन। कैनवास के पीछे नीचे बाईं ओर, हस्ताक्षर के ठीक पीछे NFC टैग लगाइए। यह हर आर्टवर्क के लिए मानक प्रक्रिया है।"},
{b:"चरण 4",t:"बिक्री चैनल जाँचें",l:["मार्केटप्लेस: आगे के चरणों के अनुसार पैक करें, फिर डिलीवरी एजेंट को सौंपें","एग्रीगेटर: चरण 5 में दी गई अतिरिक्त चीज़ें जोड़ें"],n:"चरण चार। बिक्री चैनल जाँचिए। यदि बिक्री मार्केटप्लेस के माध्यम से है, तो आगे बताए गए चरणों के अनुसार उत्पाद को पैक कीजिए और फिर आर्टवर्क डिलीवरी एजेंट को सौंप दीजिए।"},
{b:"चरण 5",t:"एग्रीगेटर ऑर्डर: ये चीज़ें जोड़ें",l:["पेंटिंग से जुड़ा T-हैंगर","स्टिकी नेल्स","नायलॉन धागा","5 डिस्प्ले कार्ड, डिस्प्ले कार्ड सेक्शन से डाउनलोड करें","बताए गए आकार में 280 से 300 GSM कागज़ पर प्रिंट करें"],n:"चरण पाँच। यदि ऑर्डर एग्रीगेटर बिक्री चैनल से है, तो ये चीज़ें जोड़िए: पेंटिंग से जुड़ा T-हैंगर, स्टिकी नेल्स और नायलॉन धागा। साथ में पाँच डिस्प्ले कार्ड भी रखिए। इन्हें डिस्प्ले कार्ड सेक्शन से डाउनलोड कीजिए और बताए गए आकार में 280 से 300 GSM कागज़ पर प्रिंट कीजिए।"},
{b:"चरण 6",t:"पेपर रोल से लपेटें",l:["आर्टवर्क के चारों ओर पेपर रोल लपेटें"],n:"चरण छह। आर्टवर्क को सावधानी से पेपर रोल में लपेटिए।"},
{b:"चरण 7",t:"किनारों की सुरक्षा करें",l:["पैकेजिंग वीडियो के अनुसार ही करें"],n:"चरण सात। आर्टवर्क के किनारों को सुरक्षित कीजिए, ठीक वैसे ही जैसे पैकेजिंग वीडियो में दिखाया गया है।"},
{b:"चरण 8",t:"बबल रैप",l:["पूरे आर्टवर्क को कुशनिंग के लिए ढकें"],n:"चरण आठ। कुशनिंग के लिए पूरे आर्टवर्क को बबल रैप से ढक दीजिए।"},
{b:"चरण 9",t:"बॉक्स में रखें",l:["कार्डबोर्ड या लकड़ी का बॉक्स","जो सुविधाजनक हो उसका उपयोग करें"],n:"चरण नौ। लपेटे हुए आर्टवर्क को कार्डबोर्ड या लकड़ी के बॉक्स में रखिए, जो भी अधिक सुविधाजनक हो।"},
{b:"चरण 10",t:"डिलीवरी स्टिकर और इनवॉइस लगाएँ",l:["दोनों बॉक्स के सामने की ओर चिपकाएँ"],n:"चरण दस। बॉक्स के सामने की ओर डिलीवरी स्टिकर और इनवॉइस लगाइए।"},

};
var cur=0,playing=false,seen={};
var $=function(i){return document.getElementById(i)};
function render(){
  var s=T(cur);
  var hv=$("edgevid"),svg=V[s.v]();
  if(svg==="VIDEO"){$("stage").innerHTML="";$("stage").appendChild(hv)}else{hv.pause();$("vidhold").appendChild(hv);$("stage").innerHTML=svg}
  $("badge").textContent=s.b;$("title").textContent=s.t;
  $("body").innerHTML='<ul class="chk">'+s.l.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul>";
  $("narr").textContent=" "+s.n;
  $("fill").style.width=((cur+1)/S.length*100)+"%";
  $("cnt").textContent=U().cnt(cur+1,S.length);
  $("prev").disabled=cur===0;$("next").disabled=cur===S.length-1;
  seen[cur]=1;
  $("dots").innerHTML=S.map(function(_,i){return'<button class="'+(i===cur?"on":seen[i]?"done":"")+'" data-i="'+i+'" aria-label="Go to scene '+(i+1)+'">'+(i+1)+"</button>"}).join("");
}
function go(i){stop();cur=Math.max(0,Math.min(S.length-1,i));render()}
function stop(){playing=false;$("play").textContent=U().play;if(window.speechSynthesis)speechSynthesis.cancel()}
function speak(){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){$("vnote").textContent="Voice narration isn’t supported in this browser. Read the narration text above.";return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(T(cur).n);
  u.rate=parseFloat($("spd").value);u.lang=lang==="hi"?"hi-IN":"en-IN";var vs=speechSynthesis.getVoices(),pre=lang==="hi"?"hi":"en",mv=vs.filter(function(v){return v.lang.toLowerCase().indexOf(pre)===0})[0];if(mv)u.voice=mv;else if(lang==="hi")$("vnote").textContent="इस डिवाइस में हिन्दी आवाज़ नहीं मिली। कृपया ऊपर लिखा नैरेशन पढ़ें, या Chrome/Android/iOS पर खोलें।";
  u.onend=function(){if(!playing)return;if(cur<S.length-1){cur++;render();setTimeout(function(){if(playing)speak()},500)}else stop()};
  u.onerror=function(){};
  speechSynthesis.speak(u);
}
$("play").onclick=function(){
  if(playing){stop();return}
  playing=true;$("play").textContent=U().pause;speak();
};
$("next").onclick=function(){go(cur+1)};
$("prev").onclick=function(){go(cur-1)};

document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
$("lh").onclick=function(){setLang("hi")};
$("le").onclick=function(){setLang("en")};
$("t1").onclick=function(){$("explainer").style.display="";$("doc").style.display="none";$("t1").className="on";$("t2").className=""};
$("t2").onclick=function(){stop();$("explainer").style.display="none";$("doc").style.display="block";$("t2").className="on";$("t1").className=""};
$("docbody").innerHTML='<h2 style="margin-top:0">Narration script: Artwork order fulfilment</h2>'+S.map(function(s,i){return'<div class="row"><h3>Scene '+(i+1)+': '+s.b+' – '+s.t+'</h3><p>'+s.n+'</p></div>'}).join("");
