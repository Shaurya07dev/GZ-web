<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aggregator Walkthrough</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2420;--mut:#7a6f66;--acc:#b8532a;--acc2:#e9c46a;--line:#e6ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#2a2522;--ink:#f3ece4;--mut:#b0a498;--acc:#e8805a;--acc2:#e9c46a;--line:#3d3631}}
:root[data-theme="dark"]{--bg:#1c1816;--card:#2a2522;--ink:#f3ece4;--mut:#b0a498;--acc:#e8805a;--acc2:#e9c46a;--line:#3d3631}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:12px;font-family:system-ui,sans-serif}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;height:300px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:12px;left:14px;background:var(--acc);color:#fff;font:600 .75rem system-ui,sans-serif;padding:4px 10px;border-radius:99px}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;animation:fadein .6s}
.e{font-size:64px;display:inline-block}
.frame{width:150px;height:110px;border:6px solid var(--acc);border-radius:4px;background:linear-gradient(135deg,var(--acc2),var(--acc));position:relative;display:flex;align-items:center;justify-content:center;font-size:44px}
.card{position:absolute;right:4px;bottom:4px;width:34px;height:20px;background:#fff;border:2px solid var(--ink);border-radius:3px;font-size:10px;color:#000;text-align:center;line-height:16px;animation:pop 1s infinite alternate}
.road{position:absolute;left:8%;right:8%;bottom:70px;border-top:3px dashed var(--line)}
.truck{position:absolute;bottom:76px;left:calc(50% - 28px);font-size:56px;animation:drive 1.6s ease-in-out infinite alternate}
.bounce{animation:bounce 1.2s ease-in-out infinite}
.spin{animation:spin 3s linear infinite}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.slide{animation:slide 2.4s ease-in-out infinite alternate}
.hammer{transform-origin:80% 80%;animation:hit .7s ease-in-out infinite}
.rise{animation:rise 2.4s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}
.d2{animation-delay:.4s}.d3{animation-delay:.8s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bounce{50%{transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes pop{to{transform:scale(1.1)}}
@keyframes slide{from{opacity:.65}to{opacity:1}}
@keyframes hit{50%{transform:rotate(-12deg)}}
@keyframes rise{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes blink{50%{opacity:.2}}
@keyframes drive{from{opacity:.7}to{opacity:1}}
.cap{margin:14px 0;min-height:84px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:12px 16px}
.cap h2{font-size:1.05rem;margin:0 0 4px}
.cap p{margin:0;line-height:1.5;color:var(--mut);font-family:system-ui,sans-serif;font-size:.95rem}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.ctl{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
button{font:600 .9rem system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dots b{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:600 .7rem/24px system-ui,sans-serif;text-align:center;cursor:pointer}
.dots b.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dots b.done{background:var(--acc2);color:#000}
.sp{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Aggregator Walkthrough</h1>
  <div class="sub">From browsing to payout, in 14 short steps</div>
  <div class="stage" id="stage"></div>
  <div class="cap"><h2 id="t"></h2><p id="n"></p></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="ctl">
    <button id="prev">&#9664; Back</button>
    <button class="main" id="play">&#9654; Play</button>
    <button id="next">Next &#9654;</button>
    <span class="sp"></span>
    <button id="snd">&#128266; Voice on</button>
    <button id="lng">हिन्दी</button>
  </div>
  <div class="dots" id="dots"></div>
</div>
<script>
var S=[
{t:"Browse the gallery",n:"Start by browsing the gallery. Look through the available artworks and see what suits your space and your buyers.",v:'<span class="e slide">🔍</span><div class="frame">🖼️</div><div class="frame" style="opacity:.6">🎨</div>'},
{t:"Select an artwork to sell",n:"Choose the artwork you would like to add for sale. Add it to your inventory selection.",v:'<div class="frame bounce">🖼️</div><span class="e pulse">✅</span>'},
{t:"Pay the security deposit",n:"Pay the security deposit for the selected artwork. This confirms your request and gets the artwork on its way.",v:'<span class="e bounce">💳</span><span class="e pulse d2">🔒</span><span class="e bounce d3">💰</span>'},
{t:"Track the shipping",n:"Track your shipment from the dashboard until the artwork arrives at your place.",v:'<div class="road"></div><span class="truck">🚚</span><span class="e pulse" style="position:absolute;top:40px;right:12%">📍</span>'},
{t:"Record the unboxing",n:"When the artwork arrives, record a video of the unboxing. Unpack carefully, and once everything is removed, keep all packing in the same box, because an unsold artwork must go back packed exactly the way it was delivered.",v:'<span class="e blink">🎥</span><span class="e bounce">📦</span><div class="frame pulse">🖼️</div>'},
{t:"Unsold after 30 days? Pack it back",n:"If the painting goes unsold within the 30 day period, pack it back the same way you received it. Print the delivery invoice and attach it to the box.",v:'<div class="frame slide">🖼️</div><span class="e bounce">📦</span><span class="e pulse d2">🧾</span>'},
{t:"Fix the nails",n:"Stick the nails provided, or use your own wall nails.",v:'<span class="e hammer">🔨</span><span class="e pulse d2">📌</span><span class="e" style="font-size:80px">🧱</span>'},
{t:"Display the artwork",n:"Hang the artwork, then stick the display card on the bottom right corner of the canvas, as shown in the picture.",v:'<div class="frame" style="width:230px;height:160px">🌅<div class="card">CARD</div></div>'},
{t:"Mark the sale",n:"Once someone purchases the artwork, mark the sale from your inventory.",v:'<span class="e pulse">📋</span><span class="e bounce d2">✔️</span>'},
{t:"Fill in the buyer's details",n:"Fill in the buyer's information, and make sure the buyer pays for the artwork.",v:'<span class="e bounce">👤</span><span class="e rise d2">💵</span><span class="e pulse d3">📝</span>'},
{t:"Choose pickup type",n:"Select the pickup type: either delivery, or self pickup by the buyer.",v:'<span class="e slide">🚚</span><span class="e pulse d2">⇄</span><span class="e bounce d3">🤝</span>'},
{t:"Add a new painting",n:"After the sale, add a new painting to your inventory by paying the security deposit.",v:'<span class="e spin">➕</span><div class="frame bounce">🖼️</div><span class="e pulse d2">💳</span>'},
{t:"Get paid within 7 business days",n:"You will receive your money within 7 business days of confirmed delivery.",v:'<span class="e rise">💵</span><span class="e bounce" style="font-size:80px">🏦</span><span class="e rise d2">💵</span>'},
{t:"That's the whole process",n:"That is the brief of the whole process an aggregator needs to do from their end. Browse, deposit, display, sell, and get paid.",v:'<span class="e bounce">🖼️</span><span class="e bounce d2">🏷️</span><span class="e bounce d3">🎉</span>'}
];
var H=[
["गैलरी ब्राउज़ करें","सबसे पहले गैलरी ब्राउज़ करें। उपलब्ध कलाकृतियाँ देखें और चुनें कि कौन सी आपकी जगह और आपके खरीदारों के लिए सही रहेगी।"],
["बिक्री के लिए कलाकृति चुनें","जिस कलाकृति को आप बिक्री के लिए जोड़ना चाहते हैं, उसे चुनें और अपनी इन्वेंटरी में जोड़ें।"],
["सिक्योरिटी डिपॉज़िट जमा करें","चुनी हुई कलाकृति के लिए सिक्योरिटी डिपॉज़िट का भुगतान करें। इससे आपका अनुरोध पक्का हो जाता है और कलाकृति आपके पास भेजी जाती है।"],
["शिपिंग ट्रैक करें","डैशबोर्ड से अपनी शिपमेंट को ट्रैक करें, जब तक कलाकृति आपके पते पर नहीं पहुँच जाती।"],
["अनबॉक्सिंग का वीडियो बनाएँ","कलाकृति पहुँचने पर अनबॉक्सिंग का वीडियो रिकॉर्ड करें। ध्यान से पैकिंग खोलें, और सब कुछ निकालने के बाद सारा पैकिंग सामान उसी डिब्बे में वैसे ही रखें, क्योंकि अगर कलाकृति नहीं बिकी तो उसे ठीक उसी तरह पैक करके लौटाना होगा जैसे वह आई थी।"],
["30 दिन में नहीं बिकी? वापस पैक करें","अगर 30 दिनों में पेंटिंग नहीं बिकती, तो उसे उसी तरीके से वापस पैक करें जैसे आपको मिली थी। डिलीवरी इनवॉइस प्रिंट करके डिब्बे पर चिपका दें।"],
["कीलें लगाएँ","साथ में दी गई कीलें चिपकाएँ, या अपनी दीवार की कीलों का इस्तेमाल करें।"],
["कलाकृति प्रदर्शित करें","कलाकृति को लगाएँ, और डिस्प्ले कार्ड को कैनवास के नीचे दाएँ कोने पर चिपकाएँ, जैसा तस्वीर में दिखाया गया है।"],
["बिक्री दर्ज करें","जब कोई कलाकृति खरीद ले, तो अपनी इन्वेंटरी से उसे बिका हुआ मार्क करें।"],
["खरीदार की जानकारी भरें","खरीदार की जानकारी भरें, और सुनिश्चित करें कि खरीदार कलाकृति का भुगतान करे।"],
["पिकअप का तरीका चुनें","पिकअप का प्रकार चुनें: या तो डिलीवरी, या खरीदार द्वारा सेल्फ पिकअप।"],
["नई पेंटिंग जोड़ें","बिक्री के बाद, सिक्योरिटी डिपॉज़िट देकर अपनी इन्वेंटरी में नई पेंटिंग जोड़ें।"],
["7 कामकाजी दिनों में भुगतान पाएँ","डिलीवरी की पुष्टि होने के 7 कामकाजी दिनों के भीतर आपको आपका पैसा मिल जाएगा।"],
["यही पूरी प्रक्रिया है","यह पूरी प्रक्रिया का सार है, जो एक एग्रीगेटर को अपनी ओर से करनी होती है। ब्राउज़ करें, डिपॉज़िट दें, प्रदर्शित करें, बेचें और भुगतान पाएँ।"]
];
var hi=false;
function T(k){return hi?H[k][0]:S[k].t}
function N(k){return hi?H[k][1]:S[k].n}
var i=0,playing=false,voice=true,tok=0,timer=null;
var $=function(x){return document.getElementById(x)};
var dots=$('dots');
S.forEach(function(s,k){var b=document.createElement('b');b.textContent=k+1;b.onclick=function(){stop();show(k)};dots.appendChild(b)});
function show(k){
  i=k;var s=S[k];
  $('stage').innerHTML='<span class="badge">'+(hi?'चरण '+(k+1)+' / '+S.length:'Step '+(k+1)+' of '+S.length)+'</span><div class="scene">'+s.v+'</div>';
  $('t').textContent=(k+1)+'. '+T(k);$('n').textContent=N(k);
  $('bar').style.width=((k+1)/S.length*100)+'%';
  [].forEach.call(dots.children,function(d,j){d.className=j===k?'on':(j<k?'done':'')});
}
function stop(){
  playing=false;tok++;clearTimeout(timer);
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  $('play').innerHTML='&#9654; Play';
}
function run(){
  var my=++tok;show(i);
  var s=S[i],done=false;
  function adv(){
    if(done||my!==tok||!playing)return;done=true;
    if(i<S.length-1){i++;run()}else{stop();i=0}
  }
  var spoke=false;
  if(voice&&window.speechSynthesis){
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance((hi?'चरण ':'Step ')+(i+1)+'. '+T(i)+'. '+N(i));
      u.lang=hi?'hi-IN':'en-US';u.rate=.95;u.onend=function(){timer=setTimeout(adv,700)};u.onerror=function(){};
      speechSynthesis.speak(u);spoke=true;
    }catch(e){}
  }
  var ms=(N(i).length*70)+2500;
  clearTimeout(timer);
  timer=setTimeout(adv,spoke?ms+8000:ms);
}
$('play').onclick=function(){
  if(playing){stop();return}
  playing=true;$('play').innerHTML='&#10074;&#10074; Pause';run();
};
$('next').onclick=function(){var w=playing;stop();show(Math.min(i+1,S.length-1));if(w){playing=true;$('play').innerHTML='&#10074;&#10074; Pause';run()}};
$('prev').onclick=function(){var w=playing;stop();show(Math.max(i-1,0));if(w){playing=true;$('play').innerHTML='&#10074;&#10074; Pause';run()}};
$('snd').onclick=function(){voice=!voice;this.innerHTML=voice?'&#128266; Voice on':'&#128263; Voice off';if(!voice){try{speechSynthesis.cancel()}catch(e){}}};
$('lng').onclick=function(){var w=playing;stop();hi=!hi;this.textContent=hi?'English':'हिन्दी';document.documentElement.lang=hi?'hi':'en';show(i);if(w){playing=true;$('play').innerHTML='&#10074;&#10074; Pause';run()}};
show(0);
</script>
</body>
</html>
