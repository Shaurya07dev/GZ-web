<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galleryzone Aggregator Process</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--card:#fff;--ink:#2a2420;--mut:#7a6f66;--acc:#b5532c;--acc2:#e9d5c6;--line:#e6ddd3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#241e18;--ink:#f3ece4;--mut:#a89c90;--acc:#e38a5c;--acc2:#3a2c22;--line:#3a3028}}
:root[data-theme="dark"]{--bg:#17130f;--card:#241e18;--ink:#f3ece4;--mut:#a89c90;--acc:#e38a5c;--acc2:#3a2c22;--line:#3a3028}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 4px;font-weight:600}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px;font-family:system-ui,sans-serif}
.head{display:flex;gap:14px;align-items:center;margin-bottom:12px}.head img{height:56px;width:auto;background:#fff;border-radius:10px;padding:4px}.head .sub{margin:0}.sw{position:relative}.wm{position:absolute;right:10px;bottom:10px;height:38px;background:#fff;border-radius:8px;padding:3px;opacity:.9}.item b.img{width:96px;height:96px;border-radius:14px;background:#fff;overflow:hidden;animation:none}.item b.img img{width:100%;height:100%;object-fit:contain}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s}
.count{font:12px system-ui,sans-serif;color:var(--mut);margin-bottom:14px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage h2{margin:0 0 18px;font-size:22px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.item{width:112px;text-align:center;opacity:0;transform:translateY(18px) scale(.9);animation:in .6s forwards}
.item b{display:flex;width:76px;height:76px;margin:0 auto 8px;border-radius:50%;background:var(--acc2);align-items:center;justify-content:center;font-size:36px;animation:fl 3s ease-in-out infinite}
.item span{font:13px/1.3 system-ui,sans-serif;color:var(--ink);display:block}
.arr{color:var(--acc);font-size:24px;opacity:0;animation:in .5s forwards}
.badge{margin-top:16px;padding:6px 14px;border-radius:20px;background:var(--acc);color:#fff;font:600 13px system-ui,sans-serif;opacity:0;animation:in .6s forwards}
@keyframes in{to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-5px)}}
.narr{margin:16px 0;padding:14px 16px;border-left:3px solid var(--acc);background:var(--card);border-radius:0 12px 12px 0;font-size:17px;line-height:1.55;min-height:96px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:600 14px system-ui,sans-serif;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--acc);transform:scale(1.25)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><img id="lg" alt="Galleryzone logo"><div><h1>Galleryzone</h1><p class="sub">A short walkthrough of the aggregator process</p></div></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="count" id="ct"></div>
  <div class="sw"><div class="stage" id="stage"></div><img class="wm" id="wm" alt="Galleryzone"></div>
  <div class="narr" id="narr" aria-live="polite"></div>
  <div class="ctl">
    <button id="prev">◀ Back</button>
    <button id="play" class="p">⏸ Pause</button>
    <button id="next">Next ▶</button>
    <button id="voice">🔇 Voice off</button>
    <button id="lang">🌐 हिंदी</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

{t:'6 · फ्रेम या कैनवास',n:'एग्रीगेटर चैनल के लिए कलाकृति फ्रेम में या कैनवास पर होनी चाहिए, ताकि उसे प्रदर्शित किया जा सके।',c:['फ्रेम में','कैनवास पर'],b:'प्रदर्शन के लिए तैयार'},

{t:'8 · पैकिंग मानदंड',n:'कलाकृति की पैकिंग Galleryzone के मानदंडों के अनुसार करें।',c:['Galleryzone के मानदंड से पैक करें','एग्रीगेटर को भेजें']},

var lang='en';
function cur(k){var s=S[k];if(lang!=='hi')return s;var h=H[k];return {t:h.t,n:h.n,flow:s.flow,b:h.b,c:s.c.map(function(c,j){return [c[0],h.c[j],c[2]]})}}
var i=0,playing=true,voice=false,tmr=null,typ=null;
var $=function(id){return document.getElementById(id)};
var dots=$('dots');$('lg').src=LOGO;$('wm').src=LOGO;
S.forEach(function(_,k){var d=document.createElement('i');d.onclick=function(){go(k)};dots.appendChild(d)});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function go(k){
  clearTimeout(tmr);clearInterval(typ);if(window.speechSynthesis)speechSynthesis.cancel();
  i=Math.max(0,Math.min(S.length-1,k));var s=cur(i);
  var h='<h2>'+esc(s.t)+'</h2><div class="row">',d=0;
  s.c.forEach(function(c,j){
    if(s.flow&&j>0){h+='<div class="arr" style="animation-delay:'+(d-.1)+'s">➜</div>'}
    h+='<div class="item" style="animation-delay:'+d+'s"><b'+(c[2]?' class="img"':'')+'>'+(c[2]?'<img alt="" src="'+IM[c[2]]+'">':c[0])+'</b><span>'+esc(c[1])+'</span></div>';d+=.45;
  });
  h+='</div>';
  if(s.b)h+='<div class="badge" style="animation-delay:'+(d+.2)+'s">'+esc(s.b)+'</div>';
  $('stage').innerHTML=h;
  $('ct').textContent=lang==='hi'?'चरण '+(i+1)+' / '+S.length:'Step '+(i+1)+' of '+S.length;
  $('pb').style.width=((i+1)/S.length*100)+'%';
  [].forEach.call(dots.children,function(e,j){e.className=j===i?'on':''});
  $('prev').disabled=i===0;$('next').disabled=i===S.length-1;
  narrate(s.n);
}
function after(){if(playing&&i<S.length-1)tmr=setTimeout(function(){go(i+1)},1800)}
function narrate(txt){
  var w=txt.split(' '),n=0,el=$('narr');el.textContent='';
  var spoke=false;
  if(voice&&window.speechSynthesis){
    var u=new SpeechSynthesisUtterance(txt);u.rate=.95;u.lang=lang==='hi'?'hi-IN':'en-IN';u.onend=function(){spoke=true;el.textContent=txt;after()};speechSynthesis.speak(u);
  }
  typ=setInterval(function(){
    n++;el.textContent=w.slice(0,n).join(' ');
    if(n>=w.length){clearInterval(typ);if(!voice)after()}
  },voice?330:230);
}
$('prev').onclick=function(){go(i-1)};
$('next').onclick=function(){go(i+1)};
$('play').onclick=function(){
  playing=!playing;this.textContent=playing?'⏸ Pause':'▶ Play';
  if(playing){if(i>=S.length-1&&$('narr').textContent===cur(i).n)go(0);else after()}else clearTimeout(tmr);
};
$('voice').onclick=function(){
  voice=!voice;this.textContent=voice?'🔊 Voice on':'🔇 Voice off';
  if(!voice&&window.speechSynthesis)speechSynthesis.cancel();go(i);
};
$('lang').onclick=function(){
  lang=lang==='hi'?'en':'hi';this.textContent=lang==='hi'?'🌐 English':'🌐 हिंदी';
  document.documentElement.lang=lang;go(i);
};
go(0);
</script>
