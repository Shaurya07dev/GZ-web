name: backend checks

# Runs the backend's own verification suite (`npm run check`): pricing
# replay, state-machine, settlement, price-leak + public-passport DTO
# contract tests, CoA numbering, policies, aggregator-cycle, API route-table
# uniqueness, a full cross-package type-check (tsc -b) and the API build —
# on every push/PR that touches backend/.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
