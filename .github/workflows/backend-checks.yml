name: backend checks

# Runs the backend's own verification suite: pricing replay, state-machine
# illegal-transition, ledger-balance property test, price-leak DTO contract
# test, policies, aggregator-cycle orchestration, API route-table
# uniqueness, the in-memory rate-config store's propose/approve/versioning
# behavior, and a full cross-package type-check (tsc -b) — on every
# push/PR that touches backend/.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  migrations:
    # Applies packages/db's generated SQL migrations against a real
    # Postgres 16 and verifies the ledger-balance CONSTRAINT TRIGGER
    # actually rejects an unbalanced transaction and accepts a balanced
    # one — not just that the SQL parses. See
    # packages/db/scripts/test-migrations.sh.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MANAGE_CONTAINER: "0"
      PGHOST: localhost
      PGPORT: "55432"
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - run: bash packages/db/scripts/test-migrations.sh
